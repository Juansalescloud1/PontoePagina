<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ponto & Página - Meus Pedidos</title>
    
    <!-- Importando as fontes do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    
    <!-- Conectando o arquivo de estilos (CSS) -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Script do JivoChat (Chat de atendimento ao cliente) que carrega de forma assíncrona -->
    <script src="//code.jivosite.com/widget/dVqa3bUvC3" async></script>
</head>
<!-- O atributo data-page ajuda o script.js a saber que estamos na página de pedidos -->
<body data-page="pedidos">

    <!-- Cabeçalho e Menu de Navegação -->
    <header>
        <div class="container nav">
            <a class="logo" href="index.html">
                <img src="img/logo.png" alt="Ponto & Página">
            </a>
            
            <nav>
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="livros.html">Livros</a></li>
                    <li><a href="papelaria.html">Papelaria</a></li>
                    <li><a href="perfil.html">Meu Perfil</a></li>
                </ul>
            </nav>

            <!-- Área do usuário no lado direito do cabeçalho -->
            <div class="actions">
                <div id="userProfile" style="display: flex; align-items: center; gap: 10px;">
                    <!-- Avatar e Nome que serão preenchidos pelo JavaScript se o usuário estiver logado -->
                    <img id="userAvatarHeader" src="img/avatar-default.svg" alt="Foto" style="width: 35px; height: 35px; border-radius: 50%; object-fit: cover;">
                    <span id="userName" style="font-size: 0.85rem; font-weight: 600; color: var(--gold);"></span>
                    
                    <!-- Botão para sair da conta -->
                    <button onclick="fazerLogout()" class="btn small outline" style="border-color: #ff7b6b; color: #ff7b6b; background: transparent;">Sair</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Área Principal da Página de Pedidos -->
    <div class="container" style="padding: 40px 0; max-width: 900px;">
        <h1 style="margin-bottom: 25px;">📦 Meus Pedidos</h1>

        <!-- Div vazia onde os pedidos do usuário vão ser injetados pelo JavaScript -->
        <div id="listaPedidos">
            <p class="muted">A carregar os seus pedidos...</p>
        </div>
    </div>

    <!-- Notificação rápida (Toast) para mensagens do sistema -->
    <div class="toast" role="status"></div>

    <!-- Rodapé -->
    <footer>
        <p>© 2026 Ponto & Página - Todos os direitos reservados.</p>
    </footer>

    <!-- Importa o arquivo JS principal do projeto -->
    <script src="script.js"></script>
    
    <!-- Script específico da página de pedidos -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Lista das chaves mais comuns onde o script.js pode ter salvo o login
            var possiveisChaves = [
                'usuarioLogado', 'usuario', 'user', 'currentUser',
                'loggedUser', 'userLogged', 'contaLogada', 'clienteLogado',
                'auth_user', 'userData', 'sessao', 'login'
            ];

            var usuarioEncontrado = null;

            // Verifica tanto no localStorage quanto no sessionStorage
            for (var i = 0; i < possiveisChaves.length; i++) {
                var valor = localStorage.getItem(possiveisChaves[i]) || sessionStorage.getItem(possiveisChaves[i]);
                
                if (valor && valor !== 'null' && valor !== 'undefined' && valor !== 'false') {
                    try {
                        usuarioEncontrado = JSON.parse(valor);
                    } catch (e) {
                        // Caso o login esteja salvo como texto simples (ex: apenas o e-mail ou nome)
                        usuarioEncontrado = valor;
                    }
                    if (usuarioEncontrado) break;
                }
            }

            // Só redireciona para o login se realmente não existir sessão ativa no navegador
            if (!usuarioEncontrado) {
                window.location.href = 'login.html';
                return;
            }

            // Executa carregarMeusPedidos() caso o script.js ainda não tenha preenchido a tela
            var lista = document.getElementById('listaPedidos');
            if (typeof carregarMeusPedidos === 'function' && (!lista || lista.querySelector('.muted'))) {
                carregarMeusPedidos();
            }
        });
    </script>
</body>
</html>
